<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brokie review desk</title>
<style>
:root{color-scheme:dark;--bg:#080d1c;--panel:#121b31;--line:#2a3857;--ink:#f2f5ff;--muted:#9eabc7;--green:#c5ff63;--blue:#85c8ff;--red:#ff8e91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#193b61 0,transparent 34rem),var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{width:min(1050px,calc(100% - 30px));margin:auto;padding:36px 0 70px}a{color:var(--blue)}h1{font-size:clamp(2.5rem,6vw,4.5rem);letter-spacing:-.055em;line-height:.95;margin:.2em 0}.eyebrow{color:var(--green);text-transform:uppercase;font-size:.72rem;font-weight:800;letter-spacing:.13em}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.progress{min-width:220px}.bar{height:8px;background:var(--panel);border-radius:99px;overflow:hidden}.bar div{height:100%;background:var(--green);width:0}.panel{background:#111a2fdd;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}.identity{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.type{padding:5px 9px;border-radius:99px;background:#263756;color:var(--green);font-size:.72rem;text-transform:uppercase;font-weight:800}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.side{background:#0b1224;border:1px solid var(--line);padding:14px;border-radius:10px}.side h3{margin:0 0 8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:.72rem;padding:4px 8px;border-radius:99px;background:#243552}.need{background:#29412e;color:#d9ffbe}.removed{opacity:.65}.decisions{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}.decision{background:#18233c;border:1px solid var(--line);padding:12px;border-radius:9px;color:var(--ink);cursor:pointer;text-align:left}.decision.selected{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:#24362e}.decision small{display:block;color:var(--muted)}fieldset{border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:12px}legend{color:var(--muted)}label.check{display:inline-flex;align-items:center;gap:6px;margin:4px 9px 4px 0;font-size:.82rem}textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0b1224;color:var(--ink);padding:10px;margin:5px 0 12px;font:inherit}textarea{min-height:76px;resize:vertical}.actions{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:#080d1ce8;padding:13px 0;backdrop-filter:blur(10px)}button{border:1px solid var(--line);border-radius:9px;padding:12px 17px;background:#18233c;color:var(--ink);cursor:pointer;font-weight:750}.save{background:var(--green);color:#111927}.status{min-height:24px;color:var(--muted)}.error{color:var(--red)}.done{text-align:center;padding:60px 20px}@media(max-width:700px){.top,.identity{display:block}.compare{grid-template-columns:1fr}.progress{margin-top:20px}}
</style></head><body><main>
<a href="/">← Search catalog</a><div class="top"><div><div class="eyebrow">Local maintainer workstation</div><h1>Make the call.</h1><p class="muted">One difference at a time. Nothing is promoted merely by reviewing it.</p></div><div class="progress"><div id="progressText" class="muted">Loading…</div><div class="bar"><div id="bar"></div></div></div></div>
<div id="workspace"></div><div class="status" id="status"></div>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let queue=[],caps=[],needs=[],reviewed=0,currentAction='',draft={};
async function get(url){const r=await fetch(url);if(!r.ok)throw new Error(await r.text());return r.json()}
const labelMap=()=>Object.fromEntries([...caps,...needs].map(x=>[x.id,x.label]));
function chips(ids,kind=''){const labels=labelMap();return ids?.length?ids.map(id=>`<span class="chip ${kind}">${esc(labels[id]||id)}</span>`).join(''):'<span class="muted">None</span>'}
function actionOptions(type){if(type==='catalog_added')return[['accept_proposal','Keep addition','Belongs in current scope'],['keep_previous','Exclude','Do not add it'],['needs_revision','New category','Keep, but taxonomy is wrong'],['merge','Merge','Duplicate or alias'],['unsure','Unsure','Research later']];if(type==='catalog_removed')return[['accept_proposal','Accept removal','Outside current scope'],['keep_previous','Keep record','Removal is wrong'],['needs_revision','New category','Keep with different taxonomy'],['merge','Merge','Retain as alias/evidence'],['unsure','Unsure','Research later']];return[['accept_proposal','Accept new tags','Candidate is correct'],['keep_previous','Keep old tags','Previous interpretation wins'],['needs_revision','Custom revision','Neither tag set is right'],['merge','Merge','Duplicate or alias'],['unsure','Unsure','Research later']]}
function saveDraft(){if(!queue[0])return;const form=document.querySelector('#reviewForm');if(!form)return;draft={action:currentAction,note:form.note.value,description_rating:form.description_rating.value,description_comment:form.description_comment.value,proposed_description:form.proposed_description.value,requirements_comment:form.requirements_comment.value,tags_comment:form.tags_comment.value,capabilities:[...form.querySelectorAll('[name=capability]:checked')].map(x=>x.value),needs:[...form.querySelectorAll('[name=need]:checked')].map(x=>x.value)};localStorage.setItem('brokie-draft-'+queue[0].review_id,JSON.stringify(draft))}
function render(){const total=reviewed+queue.length;progressText.textContent=`${reviewed} reviewed this session · ${queue.length} remaining`;bar.style.width=`${total?reviewed/total*100:100}%`;if(!queue.length){workspace.innerHTML='<div class="panel done"><div class="eyebrow">Inbox clear</div><h2>Thank you, excellent human.</h2><p class="muted">Your decisions and comments are stored in the local review database.</p></div>';return}const r=queue[0],p=r.payload,b=p.before||{},a=p.after||{};draft=JSON.parse(localStorage.getItem('brokie-draft-'+r.review_id)||'{}');currentAction=draft.action||'';const seedCaps=draft.capabilities||a.capabilities||b.capabilities||[],seedNeeds=draft.needs||a.needs||b.needs||[];workspace.innerHTML=`<form class="panel" id="reviewForm"><div class="identity"><div><div class="eyebrow">${esc(r.review_id)}</div><h2>${esc((r.identity_key.split('|')[1]||'').replace(/\b\w/g,x=>x.toUpperCase()))}</h2><a href="${esc(a.url||b.url)}" target="_blank" rel="noreferrer">Open source ↗</a></div><span class="type">${esc(r.item_type.replace('catalog_',''))}</span></div><div class="compare"><section class="side ${p.before?'':'removed'}"><h3>Trusted before</h3><p>${esc(b.description||'Not present')}</p><p class="muted">${esc(b.offer_detail||'')}</p><div class="chips">${chips(b.capabilities)}</div><div class="chips">${chips(b.needs,'need')}</div></section><section class="side ${p.after?'':'removed'}"><h3>Candidate after</h3><p>${esc(a.description||'Removed from candidate')}</p><p class="muted">${esc(a.offer_detail||'')}</p><div class="chips">${chips(a.capabilities)}</div><div class="chips">${chips(a.needs,'need')}</div></section></div><h3>Your decision</h3><div class="decisions">${actionOptions(r.item_type).map(([id,title,help])=>`<button class="decision ${currentAction===id?'selected':''}" type="button" data-action="${id}">${title}<small>${help}</small></button>`).join('')}</div><fieldset><legend>Desired capability tags</legend>${caps.map(x=>`<label class="check"><input type="checkbox" name="capability" value="${esc(x.id)}" ${seedCaps.includes(x.id)?'checked':''}>${esc(x.label)}</label>`).join('')}</fieldset><fieldset><legend>Desired user-need tags</legend>${needs.map(x=>`<label class="check"><input type="checkbox" name="need" value="${esc(x.id)}" ${seedNeeds.includes(x.id)?'checked':''}>${esc(x.label)}</label>`).join('')}</fieldset><label>Tag feedback<textarea name="tags_comment" placeholder="Missing category, tag too broad, evidence concern…">${esc(draft.tags_comment||'')}</textarea></label><label>Card description quality<select name="description_rating"><option value="unknown">Not assessed</option>${['accurate','incomplete','misleading'].map(x=>`<option value="${x}" ${draft.description_rating===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Description comments<textarea name="description_comment" placeholder="What is accurate, misleading, or absent?">${esc(draft.description_comment||'')}</textarea></label><label>Suggested card description <span class="muted">(optional)</span><textarea name="proposed_description" placeholder="A source-grounded replacement, if useful">${esc(draft.proposed_description||'')}</textarea></label><label>Requirements / eligibility feedback<textarea name="requirements_comment" placeholder="Credit card, startup verification, expiry, quota, geography, unknowns…">${esc(draft.requirements_comment||'')}</textarea></label><label>Overall reviewer comment<textarea name="note" placeholder="Why did you make this call?">${esc(draft.note||'')}</textarea></label><div class="actions"><button type="button" id="skip">Skip for now</button><button type="submit" class="save">Save & next →</button></div></form>`;document.querySelectorAll('.decision').forEach(btn=>btn.onclick=()=>{currentAction=btn.dataset.action;document.querySelectorAll('.decision').forEach(x=>x.classList.toggle('selected',x===btn));saveDraft()});document.querySelectorAll('textarea,select,input').forEach(x=>x.addEventListener('change',saveDraft));skip.onclick=()=>{saveDraft();queue.push(queue.shift());render()};reviewForm.onsubmit=submit}
async function submit(event){event.preventDefault();if(!currentAction){status.innerHTML='<span class="error">Choose a decision first.</span>';return}saveDraft();const r=queue[0];status.textContent='Saving…';const response=await fetch('/v1/reviews/'+encodeURIComponent(r.review_id),{method:'POST',headers:{'content-type':'application/json','x-brokie-review':'local'},body:JSON.stringify({action:draft.action,note:draft.note,proposed_capabilities:draft.capabilities,proposed_needs:draft.needs,card_feedback:{description_rating:draft.description_rating,description_comment:draft.description_comment,proposed_description:draft.proposed_description,requirements_comment:draft.requirements_comment,tags_comment:draft.tags_comment}})});if(!response.ok){status.innerHTML=`<span class="error">${esc(await response.text())}</span>`;return}localStorage.removeItem('brokie-draft-'+r.review_id);queue.shift();reviewed++;status.textContent='Saved.';render()}
async function init(){const [r,c,n]=await Promise.all([get('/v1/reviews?status=open&limit=100'),get('/v1/capabilities'),get('/v1/needs')]);queue=r.data;caps=c.data;needs=n.data;render()}init().catch(e=>status.innerHTML=`<span class="error">${esc(e.message)}</span>`);
</script></body></html>
